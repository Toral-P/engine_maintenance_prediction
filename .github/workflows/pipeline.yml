name: Engine Prediction Pipeline

on:
  push:
    branches:
      - main  # Automatically triggers on push to the main branch

jobs:
  ml-pipeline:
    runs-on: ubuntu-latest
    steps:
      # 1. Fetch your code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup isolated modern Python (Fixes Node warnings & global pip errors)
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Automatically caches requirements for future runs

      # 3. Install dependencies exactly once
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Step 1: Register Dataset
      - name: Upload Dataset to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python model_building/data_register.py

      # 5. Step 2: Data Preparation
      - name: Run Data Preparation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python model_building/prep.py

      # 6. Step 3: Model Training (Local MLflow tracking)
      - name: Model Building & MLflow Tracking
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # The Python script will log metrics locally to an ./mlruns directory
          python model_building/train.py

      # 7. Step 4: Deploy App
      - name: Push files to Frontend Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python hosting/hosting.py
